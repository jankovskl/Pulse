name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install frontend dependencies
        run: npm install
      - name: Drift check
        run: npm run check:drift
      # The GitHub Release notes are derived from the changelog (ADR 0007) —
      # the tag v<version> selects its section, so nothing is written twice.
      - name: Release notes from changelog
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "body<<NOTES_EOF"
            awk -v want="$VERSION" '
              /^## / { keep = ($2 == want); next }
              keep && /^- / { print }
            ' CHANGELOG.md
            echo ""
            echo "Download the installer below, or update in-app."
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      # TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD are
      # GitHub Actions secrets the repo owner must add before CI can sign and
      # publish updater artifacts:
      #   TAURI_SIGNING_PRIVATE_KEY           -> contents of %USERPROFILE%\.tauri\pulse.key
      #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  -> the key's password (pulse.key.password)
      # Without them, tauri-action cannot sign the update manifest and the
      # release workflow will fail. Do not commit key material anywhere.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'Pulse v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
